name: "iOS Build 🍎"

# The Swift module had no compile coverage, the same gap android/ had before
# the Android Build workflow existed. Braintree iOS v6 is already inactive and
# deprecates in November 2026, so the v7 migration needs something to build
# against before it touches a payments flow.
#
# Standard macos runners are free and unmetered for public repositories, so
# this costs nothing here. Only larger runners (macos-*-xlarge) are billed.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prebuild example app
        run: pnpm exec expo prebuild --platform ios --no-install
        working-directory: example
      # Compiling proves the module builds, not that the app loads it: a
      # podspec Expo could not find still compiled here, but was never
      # registered, so requireNativeModule would have thrown at runtime.
      - name: Check the module is autolinked
        run: |
          pnpm exec expo-modules-autolinking resolve --platform apple --json \
            | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")).modules;
              if (!m.some((x) => x.packageName === "@bounceapp/react-native-paypal")) {
                console.error("@bounceapp/react-native-paypal is not autolinked for apple");
                process.exit(1);
              }'
        working-directory: example
      - name: Install pods
        run: pod install
        working-directory: example/ios
      # CocoaPods generates a scheme per pod, so the library is compiled on its
      # own rather than via the whole app -- the counterpart of building
      # :bounceapp_react-native-paypal on Android.
      - name: Compile library pod
        run: |
          xcodebuild \
            -workspace reactnativepaypalexample.xcworkspace \
            -scheme react-native-paypal \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
        working-directory: example/ios
