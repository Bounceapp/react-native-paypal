name: "Quality Assurance 🔍"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-assurance:
    permissions:
      checks: write
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # commitlint walks the range between the PR base and head, so the
          # full history has to be present -- a shallow clone breaks it.
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate all commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
