name: "Quality Assurance 🔍"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-assurance:
    permissions:
      checks: write
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint walks the range between the PR base and head, so the
          # full history has to be present -- a shallow clone breaks it.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.tool-versions
      - name: Setup Yarn
        uses: actions/cache@v6
        with:
          path: node_modules
          key: yarn-cache-${{ hashFiles('**/yarn.lock', '.yarnrc') }}
          restore-keys: yarn-cache-
      - run: yarn install --frozen-lockfile
      - name: Validate all commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: yarn typecheck
      - run: yarn test
      - run: yarn lint
