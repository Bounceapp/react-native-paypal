name: "E2E 🧪"

# Runs the example app's E2E suites: the Maestro flows in example/e2e/flows on
# an iOS simulator and an Android emulator, and the Playwright tests in
# example/e2e/web against the web build.
#
# The apps are release builds, so the JS bundle is embedded and no Metro server
# has to run next to the simulator or emulator.
#
# Flows tagged `sandbox` open the real PayPal flow, which needs a Braintree
# sandbox tokenization key with PayPal enabled. It comes from the
# PAYPAL_SANDBOX_TOKENIZATION_KEY secret, and those flows are skipped when the
# secret is not available, as on pull requests from forks.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_VERSION: "2.12.0"

jobs:
  ios:
    name: iOS (Maestro)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_PAYPAL_CLIENT_TOKEN: ${{ secrets.PAYPAL_SANDBOX_TOKENIZATION_KEY }}
      HAS_SANDBOX_KEY: ${{ secrets.PAYPAL_SANDBOX_TOKENIZATION_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      # For Maestro.
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # An iPhone on the newest iOS runtime the runner has, rather than a fixed
      # model that a later runner image may no longer ship.
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | node -e '
            const { devices } = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const phones = Object.entries(devices)
              .filter(([runtime]) => runtime.includes("iOS"))
              .sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true }))
              .flatMap(([, list]) => list.filter((d) => d.name.startsWith("iPhone")));
            if (!phones.length) { console.error("No iPhone simulator available"); process.exit(1); }
            console.log(phones[phones.length - 1].udid);')
          xcrun simctl boot "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Prebuild example app
        run: pnpm exec expo prebuild --platform ios --no-install
        working-directory: example
      - name: Install pods
        run: pod install
        working-directory: example/ios
      - name: Build example app
        run: >-
          xcodebuild
          -workspace reactnativepaypalexample.xcworkspace
          -scheme reactnativepaypalexample
          -configuration Release
          -sdk iphonesimulator
          -destination "id=$UDID"
          -derivedDataPath build
          -quiet
        working-directory: example/ios
      - name: Install example app
        run: xcrun simctl install "$UDID" example/ios/build/Build/Products/Release-iphonesimulator/reactnativepaypalexample.app
      - name: Run E2E flows
        run: pnpm e2e
      - name: Run sandbox E2E flows
        if: env.HAS_SANDBOX_KEY == 'true'
        run: pnpm e2e:sandbox
      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-ios
          path: ~/.maestro/tests

  android:
    name: Android (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_PAYPAL_CLIENT_TOKEN: ${{ secrets.PAYPAL_SANDBOX_TOKENIZATION_KEY }}
      HAS_SANDBOX_KEY: ${{ secrets.PAYPAL_SANDBOX_TOKENIZATION_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prebuild example app
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: example
      # Only for the emulator's ABI: React Native's C++ for all four is most of
      # the build time. Release builds are signed with the debug keystore.
      - name: Build example app
        run: ./gradlew --console=plain :app:assembleRelease -PreactNativeArchitectures=x86_64
        working-directory: example/android
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Each line of `script` runs in its own shell, so the sandbox step is a
      # one-line `if`.
      #
      # The google_apis image's setup app often hangs on a CI first boot, and
      # its "isn't responding" dialog then covers the app under test, so such
      # dialogs are hidden. The logcat is kept for failures.
      - name: Run E2E flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb logcat -c && (adb logcat -v time > logcat.txt &)
            adb install example/android/app/build/outputs/apk/release/app-release.apk
            pnpm e2e
            if [ "$HAS_SANDBOX_KEY" = "true" ]; then pnpm e2e:sandbox; fi
      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-android
          path: |
            ~/.maestro/tests
            logcat.txt

  web:
    name: Web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: example
      - name: Run E2E tests
        run: pnpm e2e:web
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: example/test-results
