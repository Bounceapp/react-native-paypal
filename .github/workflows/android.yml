name: "Android Build 🤖"

# The Kotlin module had no compile coverage at all until this workflow existed,
# which is how an AGP 9 incompatibility reached main and had to be reported by
# an outside contributor (#628). The module is an Expo module, so it is
# compiled the way consumers actually get it: autolinked into the prebuilt
# example app, where Expo names its gradle project after the package.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - name: Setup JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prebuild example app
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: example
      # Compiling proves the module builds, not that the app loads it: a
      # podspec Expo could not find still compiled here, but was never
      # registered, so requireNativeModule would have thrown at runtime.
      - name: Check the module is autolinked
        run: |
          pnpm exec expo-modules-autolinking resolve --platform android --json \
            | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")).modules;
              if (!m.some((x) => x.packageName === "@bounceapp/react-native-paypal")) {
                console.error("@bounceapp/react-native-paypal is not autolinked for android");
                process.exit(1);
              }'
        working-directory: example
      - name: Compile and test library module
        run: >-
          ./gradlew --console=plain
          :bounceapp-react-native-paypal:assembleDebug
          :bounceapp-react-native-paypal:testDebugUnitTest
        working-directory: example/android

  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      # Keyed on the script, which pins the detekt version and its checksum.
      - name: Cache detekt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/react-native-paypal
          key: detekt-${{ hashFiles('scripts/detekt.sh') }}
      - name: Lint the Android module
        run: sh scripts/detekt.sh
