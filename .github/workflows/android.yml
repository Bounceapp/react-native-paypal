name: "Android Build 🤖"

# The Kotlin module had no compile coverage at all until this workflow existed,
# which is how an AGP 9 incompatibility reached main and had to be reported by
# an outside contributor (#628). The module is an Expo module, so it is
# compiled the way consumers actually get it: autolinked into the prebuilt
# example app, where Expo names its gradle project after the package.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ./.tool-versions
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install example dependencies
        run: yarn install --frozen-lockfile
        working-directory: example
      - name: Prebuild example app
        run: npx expo prebuild --platform android --no-install
        working-directory: example
      # Compiling proves the module builds, not that the app loads it: a
      # podspec Expo could not find still compiled here, but was never
      # registered, so requireNativeModule would have thrown at runtime.
      - name: Check the module is autolinked
        run: |
          npx expo-modules-autolinking resolve --platform android --json \
            | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")).modules;
              if (!m.some((x) => x.packageName === "@bounceapp/react-native-paypal")) {
                console.error("@bounceapp/react-native-paypal is not autolinked for android");
                process.exit(1);
              }'
        working-directory: example
      - name: Compile library module
        run: ./gradlew :bounceapp-react-native-paypal:assembleDebug --console=plain
        working-directory: example/android
