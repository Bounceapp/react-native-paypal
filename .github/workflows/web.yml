name: "Web Build 🌐"

# This does NOT mean PayPal works on web -- requestBillingAgreement calls a
# native module that does not exist there, and the README's ❌ stands. What it
# guards is that importing this package does not break a consuming app's web
# bundle. src/Paypal.ts reads NativeModules.Paypal at module scope, and any app
# targeting react-native-web imports the package whether or not it ever calls
# into PayPal.
#
# Runs on ubuntu, so it is both free and quick -- roughly a Metro bundle.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Export web bundle
        run: pnpm exec expo export --platform web --output-dir ../.web-build
        working-directory: example
