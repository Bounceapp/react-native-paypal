plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageJson = new groovy.json.JsonSlurper().parseText(file('../package.json').text)

group = 'com.reactnativepaypal'
version = packageJson.version

// An app can pin a different Braintree release by setting
// `braintreepaymentsVersion` on its root project's ext.
def braintreeVersion = rootProject.ext.has('braintreepaymentsVersion') ?
  rootProject.ext.get('braintreepaymentsVersion') : '5.33.0'

android {
  namespace 'com.reactnativepaypal'
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  lint {
    abortOnError false
  }
}

dependencies {
  implementation "com.braintreepayments.api:paypal:${braintreeVersion}"
  // PayPalLauncher.launch() takes a ComponentActivity. Braintree only depends
  // on androidx.activity as an implementation detail, so it is not on this
  // module's compile classpath unless declared. 1.9.0 is what an SDK 56 app
  // already resolves.
  implementation "androidx.activity:activity:1.9.0"
}
